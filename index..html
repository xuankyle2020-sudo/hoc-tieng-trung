function Swash() {
  return (
    <svg className="zw-swash" viewBox="0 0 180 14" fill="none">
      <path
        d="M2 8 C 30 2, 60 13, 90 7 S 150 1, 178 8"
        stroke="#A13328"
        strokeWidth="2"
        strokeLinecap="round"
      />
    </svg>
  );
}

function speak(text) {
  if (typeof window === "undefined" || !window.speechSynthesis) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "zh-CN";
  utter.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}

function SpeakIcon() {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polygon points="4 8 8 8 12 4 12 20 8 16 4 16 4 8"></polygon>
      <path d="M16 8.5c1 1 1 6 0 7"></path>
      <path d="M18.5 6.5c2 2 2 9 0 11"></path>
    </svg>
  );
}

const PAGE_SIZE = 60;

function VocabTab() {
  const [query, setQuery] = useState("");
  const [visible, setVisible] = useState(PAGE_SIZE);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return VOCAB;
    return VOCAB.filter(
      (v) =>
        v.ch.includes(query.trim()) ||
        v.py.toLowerCase().includes(q) ||
        v.vi.toLowerCase().includes(q)
    );
  }, [query]);

  const shown = filtered.slice(0, visible);

  function handleQuery(e) {
    setQuery(e.target.value);
    setVisible(PAGE_SIZE);
  }

  return (
    <div>
      <div className="zw-searchbar">
        <input
          className="zw-search"
          type="text"
          placeholder="Tìm theo chữ Hán, pinyin hoặc nghĩa..."
          value={query}
          onChange={handleQuery}
        />
      </div>
      <div className="zw-count">
        {filtered.length} / {VOCAB.length} từ HSK 5 · chạm vào thẻ để xem nghĩa
      </div>
      {shown.length === 0 ? (
        <div className="zw-empty">Không tìm thấy từ nào phù hợp.</div>
      ) : (
        <FlashGrid words={shown} />
      )}
      {visible < filtered.length && (
        <div className="zw-loadmore-wrap">
          <button
            className="zw-loadmore"
            onClick={() => setVisible((v) => v + PAGE_SIZE)}
          >
            Xem thêm {Math.min(PAGE_SIZE, filtered.length - visible)} từ
          </button>
        </div>
      )}
    </div>
  );
}

function FlashGrid({ words }) {
  const [flipped, setFlipped] = useState({});
  function toggle(id) {
    setFlipped((f) => ({ ...f, [id]: !f[id] }));
  }
  return (
    <div className="zw-grid">
      {words.map((v) => (
        <div className="zw-card" key={v.id} onClick={() => toggle(v.id)}>
          <button
            className="zw-speak-btn"
            aria-label={"Phát âm " + v.ch}
            onClick={(e) => {
              e.stopPropagation();
              speak(v.ch);
            }}
          >
            <SpeakIcon />
          </button>
          <span className="zw-hsktag">HSK{v.hsk}</span>
          {!flipped[v.id] ? (
            <>
              <div className="zw-ch">{v.ch}</div>
              <div className="zw-py">{v.py}</div>
            </>
          ) : (
            <div className="zw-vi">{v.vi}</div>
          )}
        </div>
      ))}
    </div>
  );
}

function GrammarTab() {
  return (
    <div className="zw-glist">
      {GRAMMAR.map((g) => (
        <div className="zw-gcard" key={g.id}>
          <div className="zw-gseal">{g.pattern}</div>
          <p className="zw-gname">{g.name}</p>
          <p className="zw-gexplain">{g.explain}</p>
          {g.examples.map((ex, i) => (
            <div className="zw-gex" key={i}>
              <div className="zw-gex-ch">
                <button className="zw-gex-speak" aria-label={"Phát âm " + ex.ch} onClick={() => speak(ex.ch)}>
                  <SpeakIcon />
                </button>
                {ex.ch}
              </div>
              <div className="zw-gex-py">{ex.py}</div>
              <div className="zw-gex-vi">{ex.vi}</div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function shuffleArr(arr) {
  return [...arr]
    .map((v) => [Math.random(), v])
    .sort((a, b) => a[0] - b[0])
    .map(([, v]) => v);
}

function buildVocabQuestions(n) {
  const idxs = new Set();
  while (idxs.size < n && idxs.size < VOCAB.length) {
    idxs.add(Math.floor(Math.random() * VOCAB.length));
  }
  return Array.from(idxs).map((vi) => {
    const item = VOCAB[vi];
    const distractors = [];
    let guard = 0;
    while (distractors.length < 3 && guard < 200) {
      guard++;
      const di = Math.floor(Math.random() * VOCAB.length);
      const cand = VOCAB[di];
      if (cand.id === item.id) continue;
      if (distractors.some((d) => d.vi === cand.vi)) continue;
      distractors.push(cand);
    }
    const optionItems = shuffleArr([item, ...distractors]);
    const options = optionItems.map((o) => o.vi);
    const answer = optionItems.findIndex((o) => o.id === item.id);
    return {
      id: "vq-" + item.id,
      prompt: item.ch + "（" + item.py + "）",
      options,
      answer,
    };
  });
}

function QuizVocabRandom() {
  const [questions, setQuestions] = useState(() => buildVocabQuestions(8));
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);

  const q = questions[idx];

  function choose(i) {
    if (selected !== null) return;
    setSelected(i);
    if (i === q.answer) setScore((s) => s + 1);
  }
  function next() {
    if (idx + 1 >= questions.length) {
      setDone(true);
      return;
    }
    setIdx((n) => n + 1);
    setSelected(null);
  }
  function restart() {
    setQuestions(buildVocabQuestions(8));
    setIdx(0);
    setSelected(null);
    setScore(0);
    setDone(false);
  }

  if (done) {
    return (
      <div className="zw-quiz-wrap">
        <div className="zw-qcard zw-qscore">
          <p className="zw-qscore-num">
            {score}/{questions.length}
          </p>
          <p className="zw-qscore-label">Câu trả lời đúng</p>
          <button className="zw-restart" onClick={restart}>
            Làm ván mới
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="zw-quiz-wrap">
      <div className="zw-qprogress">
        CÂU {idx + 1} / {questions.length} · ĐIỂM {score}
      </div>
      <div className="zw-qcard">
        <p className="zw-qprompt">{q.prompt}</p>
        {q.options.map((opt, i) => {
          let cls = "zw-qopt";
          if (selected !== null) {
            if (i === q.answer) cls += " zw-correct";
            else if (i === selected) cls += " zw-wrong";
          }
          return (
            <button key={i} className={cls} onClick={() => choose(i)}>
              {opt}
            </button>
          );
        })}
        {selected !== null && (
          <button className="zw-qnext" onClick={next}>
            {idx + 1 >= questions.length ? "Xem kết quả" : "Câu tiếp theo"}
          </button>
        )}
      </div>
    </div>
  );
}

function pickMatchSet() {
  const idxs = new Set();
  while (idxs.size < 6) idxs.add(Math.floor(Math.random() * VOCAB.length));
  return Array.from(idxs).map((i) => VOCAB[i]);
}

function MatchGame() {
  const [items, setItems] = useState(() => pickMatchSet());
  const [leftOrder, setLeftOrder] = useState(() => shuffleArr(items));
  const [rightOrder, setRightOrder] = useState(() => shuffleArr(items));
  const [selLeft, setSelLeft] = useState(null);
  const [matched, setMatched] = useState({});
  const [wrongPair, setWrongPair] = useState(null);

  function clickLeft(id) {
    if (matched[id]) return;
    setSelLeft(id);
    setWrongPair(null);
  }
  function clickRight(id) {
    if (!selLeft || matched[id]) return;
    if (selLeft === id) {
      setMatched((m) => ({ ...m, [id]: true }));
      setSelLeft(null);
    } else {
      setWrongPair(id);
      setTimeout(() => {
        setWrongPair(null);
        setSelLeft(null);
      }, 500);
    }
  }
  function newRound() {
    const next = pickMatchSet();
    setItems(next);
    setLeftOrder(shuffleArr(next));
    setRightOrder(shuffleArr(next));
    setMatched({});
    setSelLeft(null);
    setWrongPair(null);
  }

  const done = Object.keys(matched).length === items.length;

  return (
    <div>
      <div className="zw-count">Chạm 1 từ bên trái rồi chạm nghĩa đúng bên phải</div>
      <div className="zw-match-grid">
        <div className="zw-match-col">
          {leftOrder.map((it) => (
            <button
              key={it.id}
              className={
                "zw-match-btn" +
                (selLeft === it.id ? " zw-msel" : "") +
                (matched[it.id] ? " zw-mmatched" : "")
              }
              onClick={() => clickLeft(it.id)}
              disabled={!!matched[it.id]}
            >
              {it.ch}
            </button>
          ))}
        </div>
        <div className="zw-match-col">
          {rightOrder.map((it) => (
            <button
              key={it.id}
              className={
                "zw-match-btn" +
                (wrongPair === it.id ? " zw-mwrong" : "") +
                (matched[it.id] ? " zw-mmatched" : "")
              }
              onClick={() => clickRight(it.id)}
              disabled={!!matched[it.id]}
            >
              {it.vi}
            </button>
          ))}
        </div>
      </div>
      {done && <div className="zw-match-done">Hoàn thành cả 6 cặp!</div>}
      <div className="zw-loadmore-wrap">
        <button className="zw-loadmore" onClick={newRound}>
          Ván mới
        </button>
      </div>
    </div>
  );
}

function tokenizeSentence(sentence) {
  return sentence.tokens.map((t, i) => ({ t, i }));
}

function SentenceOrder() {
  const [idx, setIdx] = useState(0);
  const sentence = SENTENCES[idx];
  const [pool, setPool] = useState(() => shuffleArr(tokenizeSentence(sentence)));
  const [chosen, setChosen] = useState([]);
  const [feedback, setFeedback] = useState(null);

  function pick(tok) {
    setChosen((c) => [...c, tok]);
    setFeedback(null);
  }
  function removeChosen(pos) {
    setChosen((c) => c.filter((_, i) => i !== pos));
    setFeedback(null);
  }
  function check() {
    const built = chosen.map((c) => c.t).join("");
    const correct = sentence.tokens.join("");
    setFeedback(built === correct ? "ok" : "bad");
  }
  function loadSentence(n) {
    setIdx(n);
    setPool(shuffleArr(tokenizeSentence(SENTENCES[n])));
    setChosen([]);
    setFeedback(null);
  }
  function next() {
    loadSentence((idx + 1) % SENTENCES.length);
  }
  function reset() {
    setPool(shuffleArr(tokenizeSentence(sentence)));
    setChosen([]);
    setFeedback(null);
  }

  const usedSet = new Set(chosen.map((c) => c.i));

  return (
    <div className="zw-quiz-wrap">
      <div className="zw-qprogress">
        CÂU {idx + 1} / {SENTENCES.length}
      </div>
      <div className="zw-order-vi">{sentence.vi}</div>
      <div className="zw-order-target">
        {chosen.length === 0 && (
          <span className="zw-order-placeholder">
            Chạm vào các từ bên dưới theo đúng thứ tự
          </span>
        )}
        {chosen.map((c, pos) => (
          <span
            key={pos}
            className="zw-order-token"
            onClick={() => removeChosen(pos)}
          >
            {c.t}
          </span>
        ))}
      </div>
      <div className="zw-order-pool">
        {pool.map((c) => (
          <span
            key={c.i}
            className={"zw-order-token" + (usedSet.has(c.i) ? " zw-usedToken" : "")}
            onClick={() => !usedSet.has(c.i) && pick(c)}
          >
            {c.t}
          </span>
        ))}
      </div>
      {feedback && (
        <div className={"zw-order-feedback " + (feedback === "ok" ? "ok" : "bad")}>
          {feedback === "ok"
            ? "Chính xác!"
            : "Chưa đúng thứ tự. Câu đúng: " + sentence.tokens.join("")}
        </div>
      )}
      <div className="zw-order-actions">
        <button className="zw-restart" onClick={check}>
          Kiểm tra
        </button>
        <button className="zw-loadmore" onClick={reset}>
          Làm lại
        </button>
        <button className="zw-loadmore" onClick={next}>
          Câu tiếp theo
        </button>
      </div>
    </div>
  );
}

function QuizStatic() {
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);

  const q = QUIZ[idx];

  function choose(i) {
    if (selected !== null) return;
    setSelected(i);
    if (i === q.answer) setScore((s) => s + 1);
  }

  function next() {
    if (idx + 1 >= QUIZ.length) {
      setDone(true);
      return;
    }
    setIdx((n) => n + 1);
    setSelected(null);
  }

  function restart() {
    setIdx(0);
    setSelected(null);
    setScore(0);
    setDone(false);
  }

  if (done) {
    return (
      <div className="zw-quiz-wrap">
        <div className="zw-qcard zw-qscore">
          <p className="zw-qscore-num">
            {score}/{QUIZ.length}
          </p>
          <p className="zw-qscore-label">Câu trả lời đúng</p>
          <button className="zw-restart" onClick={restart}>
            Làm lại
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="zw-quiz-wrap">
      <div className="zw-qprogress">
        CÂU {idx + 1} / {QUIZ.length} · ĐIỂM {score}
      </div>
      <div className="zw-qcard">
        <p className="zw-qprompt">{q.prompt}</p>
        {q.options.map((opt, i) => {
          let cls = "zw-qopt";
          if (selected !== null) {
            if (i === q.answer) cls += " zw-correct";
            else if (i === selected) cls += " zw-wrong";
          }
          return (
            <button key={i} className={cls} onClick={() => choose(i)}>
              {opt}
            </button>
          );
        })}
        {selected !== null && (
          <button className="zw-qnext" onClick={next}>
            {idx + 1 >= QUIZ.length ? "Xem kết quả" : "Câu tiếp theo"}
          </button>
        )}
      </div>
    </div>
  );
}

function PracticeTab() {
  const [mode, setMode] = useState("vocabq");
  const MODES = [
    ["vocabq", "Trắc nghiệm từ vựng"],
    ["match", "Nối từ"],
    ["order", "Sắp xếp câu"],
    ["mixed", "Tổng hợp"],
  ];
  return (
    <div>
      <div className="zw-filters">
        {MODES.map(([key, label]) => (
          <button
            key={key}
            className={"zw-chip" + (mode === key ? " zw-chipActive" : "")}
            onClick={() => setMode(key)}
          >
            {label}
          </button>
        ))}
      </div>
      {mode === "vocabq" && <QuizVocabRandom />}
      {mode === "match" && <MatchGame />}
      {mode === "order" && <SentenceOrder />}
      {mode === "mixed" && <QuizStatic />}
    </div>
  );
}

  const TABS = [
    { key: "vocab", cn: "词汇", vi: "Từ vựng" },
    { key: "grammar", cn: "语法", vi: "Ngữ pháp" },
    { key: "practice", cn: "练习", vi: "Luyện tập" },
  ];

  return (
    <div className="zw-root">
      <style>{STYLE}</style>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap"
      />
      <div className="zw-header">
        <h1 className="zw-cn-title">学中文</h1>
        <p className="zw-vi-title">Học tiếng Trung · Từ vựng HSK 5</p>
        <Swash />
      </div>

      <div className="zw-tabs">
        {TABS.map((t) => (
          <button
            key={t.key}
            className={"zw-tab" + (tab === t.key ? " zw-active" : "")}
            onClick={() => setTab(t.key)}
          >

          </button>
        ))}
      </div>

      {tab === "vocab" && <VocabTab />}
      {tab === "grammar" && <GrammarTab />}
      {tab === "practice" && <PracticeTab />}
    </div>
  );
}
